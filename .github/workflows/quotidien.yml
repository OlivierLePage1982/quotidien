
name: Actualisation des invités de Quotidien

on:
  schedule:
    - cron: "30 17,18 * * 1-5"
      timezone: "Europe/Paris"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualiser:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: |
          pip install requests beautifulsoup4

      - name: Récupérer les invités
        run: python recuperer_invites.py

      - name: Enregistrer les changements
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add quotidien.json
          git diff --cached --quiet || (
            git commit -m "Actualisation des invités de Quotidien" &&
            git push
          )
