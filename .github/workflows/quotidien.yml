name: Actualisation des invités de Quotidien

on:
  schedule:
    # Vérifications fréquentes autour de 17h30, 18h30 et 19h30, heure de Paris.
    # Le contrôle Python ci-dessous tient compte du changement heure été/hiver.
    - cron: "0,30 15-18 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualiser:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: |
          pip install requests beautifulsoup4

      - name: Vérifier l'heure de Paris
        id: horaire
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          from datetime import datetime
          from zoneinfo import ZoneInfo
          now = datetime.now(ZoneInfo("Europe/Paris"))
          run = now.weekday() < 5 and (now.hour, now.minute) in [(17, 30), (18, 30)]
          print(f"run={str(run).lower()}")
          PY

      - name: Récupérer les invités
        if: github.event_name == 'workflow_dispatch' || steps.horaire.outputs.run == 'true'
        run: python quotidien/recuperer_invites.py

      - name: Enregistrer les changements
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add quotidien/quotidien.json
          git diff --cached --quiet || (
            git commit -m "Actualisation des invités de Quotidien" &&
            git push
          )
